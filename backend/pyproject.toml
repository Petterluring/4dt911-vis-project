[project]
name = "vis-project-backend"
version = "1.0.0"
description = "Backend service for the 4DT911 visualization project"
readme = "README.md"
requires-python = ">=3.11,<4.0"
authors = [{ name = "Petter Gustafsson", email = "petter.gustafsson1998@gmail.com" }]
maintainers = [{ name = "Petter Gustafsson", email = "petter.gustafsson1998@gmail.com" }]

dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
mypy = "^1.15.0"
ruff = "^0.9.0"
pytest = "^8.3.0"

[tool.pytest]
testpaths = [
    "test",
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"