[project]
name = "vis-project-backend"
version = "1.0.0"
description = "Backend service for the 4DT911 visualization project"
readme = "README.md"
requires-python = ">=3.14.0,<3.15.0"
authors = [{ name = "Petter Gustafsson", email = "petter.gustafsson1998@gmail.com" }]
maintainers = [{ name = "Petter Gustafsson", email = "petter.gustafsson1998@gmail.com" }]

dependencies = [
    "fastapi>=0.141.0", # Requires Python>=3.10. Includes: Pydantic and Starlette.
    "uvicorn[standard]>=0.52.0", # Requires Python>=3.10.
    "mlflow-skinny>=3.16.0, <4.0.0", # Python>=3.10,
    "psycopg[binary]>=3.3.6",
    "SQLAlchemy>=2.0.54",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3.0,<3.0.0",
    "ruff>=0.16.0,<0.17.0",
    "pytest>=9.1.0,<10.0.0",
    "types-PyYAML>=6.0.12"
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.pytest]
testpaths = [
    "test",
]

[tool.mypy]
strict = true
files = [
    "app",
    "test",
]

[tool.ruff]
include = [
    "app/**/*.py",
    "test/**/*.py",
]

line-length = 120

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # Pyflakes
    "I",  # Import sorting
    "D",  # Docstring conventions
    "W",  # pycodestyle warnings
]

ignore = [
    "D105", # Magic methods do not need docstrings.
    "D107", # __init__ methods do not need docstrings.
    "D211", # Incorrect blank line before class
    "D213", # Multi line summary second line
    "D203", # Ignore one line between class and docstring
    "D204", # Ignore one line between docstring and fields
]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"