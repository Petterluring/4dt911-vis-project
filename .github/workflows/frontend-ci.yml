name: Frontend CI

on:
  push:
    branches: ["feature/**"]
    paths: 
      - "frontend/**/*.ts"
      - "frontend/**/*.tsx"
      - "frontend/**/*.json"
      - "frontend/**/*.css"
      - ".github/workflows/frontend-ci.yml"
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
